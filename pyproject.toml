[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tio2gen"
version = "0.1.0"
description = "TiO2 (anatase/rutile) supercells with tunable crystallinity, exported to XYZ, CIF and DFTB+ GEN."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Matias Berdakin" }]
requires-python = ">=3.8"
dependencies = ["ase>=3.22", "numpy>=1.20", "scipy>=1.5"]
keywords = ["TiO2", "anatase", "rutile", "amorphous", "DFTB+", "ASE", "materials science"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
examples = ["matplotlib>=3.5"]

[project.scripts]
tio2gen = "tio2gen.cli:main"

[tool.setuptools]
packages = ["tio2gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
